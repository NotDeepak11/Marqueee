<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Navbar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    min-height:100vh;
    background:#f4f6f9;
}

.navbar{
    height:80px;
    background:#1e293b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    border-radius:25px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#38bdf8;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    font-weight:bold;
}
.nav-links{
    display:flex;
    gap:35px;
    list-style:none;
    color: #f4f6f9;
}





.btn{
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:#38bdf8;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}
.newdiv{
    width:100%;
    height: 70vh;
    background-color:bisque;
    margin-top:10px;
    border-radius: 25px;
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;


}
.box{
    height:20vh;
    width:20%;
    background-color:#1e293b;

}
.box1{
    height:20vh;
    width:20%;
    background-color:bisque;

}


</style>
</head>
<body>

<div class="navbar">

    <div class="logo"></div>

    <ul class="nav-links">
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Projects</li>
        <li>Contact</li>
    </ul>

    <button class="btn">LOGIN</button>

</div>
<div class="newdiv">
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box" img src="https://c.ndtvimg.com/2026-05/8gcmhb4k_pm-modi-meloni-melody_625x300_21_May_26.jpg?im=FitAndFill,algorithm=dnn,width=1200,height=738"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <div class="box1"></div>



</div>

</body>
</html>
