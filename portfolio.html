<!DOCTYPE html>
<html>
<head>
    <title>Coding lab Profile Card</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:orange;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:350px;
            background-color:white;
            border:2px solid black;
            border-radius:20px;
            text-align:center;
            overflow:hidden;
        }

        .header{
            height:140px;
            background-color:royalblue;
        }

        .profile-pic{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid black;
            margin:-60px auto 10px;
            overflow:hidden;
            background:white;
        }

        .profile-pic img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .info h2{
            margin-top:10px;
        }

        .info p{
            color:gray;
            margin-top:5px;
        }

        .stats{
            display:flex;
            justify-content:space-around;
            margin:25px 0;
        }

        .stat-box{
            text-align:center;
        }

        .icon{
            width:45px;
            height:45px;
            border:2px solid black;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            margin-bottom:5px;
        }

        .buttons{
            margin:10px 0;
        }

        button{
            padding:10px 20px;
            margin:5px;
            border-radius:8px;
            cursor:pointer;
            border:none;
            color:white;
            font-weight:bold;
        }

        button:hover{
            opacity:0.9;
        }

        button.follow{
            background-color:royalblue;
        }

        button.message{
            background-color:green;
        }

        button.facebook{
            background-color:#1877F2;
        }

        button.twitter{
            background-color:#202121;
        }

        .footer{
            background:red;
            padding:10px;
            font-size:14px;
            color:black;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header"></div>
        <div class="profile-pic">
            <img src="untitled-design-16.avif" alt="Profile Picture">
        </div>
        <div class="info">
            <h2>Melody</h2>
            <p>Desh ka Developer</p>
        </div>

        <div class="buttons">
            <button class="facebook">Facebook</button>
            <button class="twitter">X</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="icon">🦷</div>
                <p>120M Pyaar</p>
            </div>
            <div class="stat-box">
                <div class="icon">✒️</div>
                <p>50M Bhakt</p>
            </div>
            <div class="stat-box">
                <div class="icon">🥸</div>
                <p>35K Tarakki</p>
            </div>
        </div>

        <div class="buttons">
            <button class="follow">Bhakt Banee</button>
            <button class="message">Sampark kre</button>
        </div>

        <div class="footer">
            MODI HAI TO MUMKIN HAI!!!<br>
            MODIJI BHAGWAN HAI!!
        </div>
    </div>
</body>
</html>
