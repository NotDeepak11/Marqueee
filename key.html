<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    overflow: hidden;
}

#box {
    position: absolute;
    width: 80px;
    height: 80px;
    background: blue;
    top: 100px;
    left: 100px;
    background-image: "generated_image.png";
}
</style>
</head>
<body>

<div id="box" ></div>

<script>
const box = document.getElementById("box");

let topPos = 100;
let leftPos = 100;

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") topPos-=20;
    if (e.key === "ArrowDown") topPos+=20;
    if (e.key === "ArrowLeft") leftPos-=20;
    if (e.key === "ArrowRight") leftPos+=20;

    box.style.top = topPos + "px";
    box.style.left = leftPos + "px";
});
</script>

</body>
</html>
