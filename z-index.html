<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlapping Squares</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f2f2f2;
            position:relative;
            height:100vh;
        }

        .container{
            position:relative;
            width:700px;
            height:600px;
            margin:20px auto;
        }
        .box{
            width:150px;
            height:150px;
            border:5px solid black;
            position:absolute;
        }
        .box:first-child:hover{
            background:red;
            top:0;
            left:0;as
            z-index:4;
           
        }

        .box:nth-child(2){
            background:#27b446;
            top:85px;
            left:85px;
            z-index:3;
        }

        .box:nth-child(3){
            background:#1998d5;
            top:165px;
            left:170px;
            z-index:2;
        }

        .box:last-child{
            background:yellow;
            top:250px;
            left:265px;
            z-index:1;
        }

    </style>
</head>

<body>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
</html>
